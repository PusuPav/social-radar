# Runs social-radar on GitHub's servers every hour, free for public repos.
# Add your keys under Settings → Secrets and variables → Actions.
name: social-radar

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      dry_run:
        description: "Dry run: print matches in the log, send nothing, save nothing"
        type: boolean
        default: true

concurrency:
  group: social-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .

      # The SQLite file remembers what you've been alerted about between runs.
      - uses: actions/cache@v4
        if: ${{ !inputs.dry_run }}
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Run
        run: |
          social-radar -c "${{ vars.WATCHLIST || 'watchlist.yaml' }}" validate
          social-radar -c "${{ vars.WATCHLIST || 'watchlist.yaml' }}" run ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          LINKEDIN_ALERT_FEED: ${{ secrets.LINKEDIN_ALERT_FEED }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
